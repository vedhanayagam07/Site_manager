<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TSR Builders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B1628;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #111E36;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-box svg {
      width: 32px;
      height: 32px;
      stroke: #60A5FA;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #FFFFFF;
    }
    p {
      font-size: 0.875rem;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: #2563EB;
      color: #FFFFFF;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #1D4ED8; }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FBBF24;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 8.5a7 7 0 0110.13 2.13M5.07 10.93a11 11 0 0115.86 0M1.06 14.93a15 15 0 015.35-3.32M10.5 17.5a2 2 0 114 0" />
      </svg>
    </div>
    <h1>You are Currently Offline</h1>
    <p>
      TSR Builders operates with offline readiness. Any workforce attendance entries saved while disconnected remain protected in your local Outbox and will synchronize once connectivity returns.
    </p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Reload</button>
    <div class="badge">Offline Outbox Protection Active</div>
  </div>
</body>
</html>
